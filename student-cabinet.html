<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Мой кабинет</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg:           #FAF9F6;
  --nav:          #2D3748;
  --accent:       #4A8C6E;
  --accent-light: #EDF7F1;
  --highlight:    #7CC8A0;
  --urgent:       #D97706;
  --text:         #1A1A1A;
  --muted:        #718096;
  --border:       #E2E8F0;
}

body {
  font-family: 'Segoe UI', system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  padding-bottom: 80px; /* место для таб-бара */
}

/* BOTTOM TAB BAR */
.tab-bar {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  background: #fff;
  border-top: 1px solid var(--border);
  display: flex;
  z-index: 100;
  height: 60px;
}
.tab-btn {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3px;
  background: none;
  border: none;
  cursor: pointer;
  font-family: inherit;
  color: var(--muted);
  font-size: 11px;
  font-weight: 600;
  transition: color .15s;
  min-height: 44px;
}
.tab-btn.active { color: var(--accent); }
.tab-icon { font-size: 20px; line-height: 1; }

/* SCREENS */
.screen { display: none; }
.screen.active { display: block; }

/* GRAMMAR SCREEN */
.grammar-group-title {
  padding: 20px 20px 8px;
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: .8px;
  color: var(--muted);
}
.grammar-card {
  margin: 0 16px 10px;
  background: #fff;
  border-radius: 14px;
  border: 1.5px solid var(--border);
  overflow: hidden;
  transition: border-color .15s;
}
.grammar-card.current { border-color: var(--accent); }
.grammar-card.upcoming { opacity: .6; }
.grammar-toggle {
  width: 100%;
  padding: 14px 18px;
  background: none;
  border: none;
  display: flex;
  align-items: center;
  gap: 12px;
  cursor: pointer;
  font-family: inherit;
  text-align: left;
  min-height: 52px;
}
.grammar-status-dot {
  width: 10px; height: 10px;
  border-radius: 50%;
  flex-shrink: 0;
}
.grammar-card.done .grammar-status-dot { background: var(--accent); }
.grammar-card.current .grammar-status-dot { background: var(--accent); box-shadow: 0 0 0 3px rgba(74,140,110,.2); }
.grammar-card.upcoming .grammar-status-dot { background: var(--border); }
.grammar-toggle-label {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.grammar-topic-name {
  font-size: 14px;
  font-weight: 700;
  color: var(--text);
}
.grammar-topic-level {
  font-size: 11px;
  color: var(--muted);
}
.grammar-arrow {
  font-size: 16px;
  color: var(--muted);
  transition: transform .2s;
  flex-shrink: 0;
}
.grammar-toggle.open .grammar-arrow { transform: rotate(180deg); }
.grammar-body {
  display: none;
  padding: 0 18px 16px;
  border-top: 1px solid var(--border);
  padding-top: 14px;
}
.grammar-body.visible { display: block; }
.grammar-summary {
  font-size: 14px;
  color: #374151;
  line-height: 1.7;
  margin-bottom: 12px;
}
.grammar-example {
  background: var(--accent-light);
  border-left: 3px solid var(--highlight);
  border-radius: 0 8px 8px 0;
  padding: 10px 14px;
  font-size: 13px;
  color: #2E6B4F;
  line-height: 1.6;
  font-style: italic;
}

/* HEADER */
.header {
  background: var(--nav);
  padding: 14px 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.header-title {
  color: rgba(255,255,255,.9);
  font-size: 15px;
  font-weight: 600;
}
.header-level {
  background: var(--accent);
  color: #fff;
  font-size: 11px;
  font-weight: 700;
  padding: 3px 10px;
  border-radius: 20px;
  letter-spacing: .3px;
}

/* GREETING */
.greeting {
  padding: 24px 20px 0;
}
.greeting-name {
  font-size: 22px;
  font-weight: 800;
  color: var(--text);
  margin-bottom: 4px;
}
.greeting-date {
  font-size: 13px;
  color: var(--muted);
}

/* TASK CARD */
.task-card {
  margin: 20px 16px 0;
  background: #fff;
  border-radius: 16px;
  border: 1.5px solid var(--border);
  overflow: hidden;
}
.task-card-header {
  background: var(--accent);
  padding: 12px 18px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.task-card-label {
  color: rgba(255,255,255,.85);
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: .8px;
}
.task-card-topic {
  padding: 16px 18px 8px;
  font-size: 17px;
  font-weight: 700;
  color: var(--text);
  line-height: 1.3;
}
.task-card-body {
  padding: 0 18px 16px;
  font-size: 14px;
  color: #374151;
  line-height: 1.65;
}
.task-meta {
  display: flex;
  gap: 16px;
  padding: 12px 18px;
  border-top: 1px solid var(--border);
  background: #FAFAFA;
}
.task-meta-item {
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.task-meta-label {
  font-size: 10px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: .6px;
  color: var(--muted);
}
.task-meta-value {
  font-size: 13px;
  color: var(--text);
  font-weight: 600;
}
.task-meta-value.urgent {
  color: var(--urgent);
}

/* HINT */
.hint-toggle {
  margin: 0 18px 16px;
  background: none;
  border: 1.5px solid var(--border);
  border-radius: 10px;
  padding: 10px 14px;
  width: calc(100% - 36px);
  text-align: left;
  cursor: pointer;
  font-family: inherit;
  font-size: 13px;
  color: var(--muted);
  display: flex;
  align-items: center;
  gap: 8px;
  min-height: 44px;
  transition: border-color .15s, color .15s;
}
.hint-toggle:hover { border-color: var(--accent); color: var(--accent); }
.hint-toggle.open { border-color: var(--accent); color: var(--accent); background: var(--accent-light); }
.hint-body {
  display: none;
  margin: 0 18px 16px;
  padding: 12px 14px;
  background: var(--accent-light);
  border-radius: 10px;
  font-size: 13px;
  color: #2E6B4F;
  line-height: 1.6;
  border-left: 3px solid var(--highlight);
}
.hint-body.visible { display: block; }

/* ACTION BUTTON */
.action-btn {
  display: block;
  margin: 20px 16px 0;
  padding: 15px 20px;
  background: var(--accent);
  color: #fff;
  font-size: 15px;
  font-weight: 700;
  border: none;
  border-radius: 14px;
  cursor: pointer;
  text-align: center;
  min-height: 52px;
  text-decoration: none;
  font-family: inherit;
  width: calc(100% - 32px);
  transition: background .15s;
}
.action-btn:hover { background: #2E6B4F; }

/* LEVEL BADGES */
.level-badge {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-size: 10px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: .6px;
  padding: 3px 9px;
  border-radius: 20px;
  margin-bottom: 8px;
}
.badge-pflicht { background: var(--accent); color: #fff; }
.badge-optional { background: var(--border); color: var(--muted); }

/* REVIEW CARD (level 0) */
.review-card {
  margin: 16px 16px 0;
  border: 1.5px dashed var(--border);
  border-radius: 14px;
  overflow: hidden;
}
.review-toggle {
  width: 100%;
  padding: 13px 18px;
  background: none;
  border: none;
  display: flex;
  align-items: center;
  justify-content: space-between;
  cursor: pointer;
  font-family: inherit;
  min-height: 48px;
}
.review-toggle-left {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 13px;
  color: var(--muted);
  font-weight: 600;
}
.review-toggle-arrow {
  font-size: 16px;
  color: var(--muted);
  transition: transform .2s;
}
.review-toggle.open .review-toggle-arrow { transform: rotate(180deg); }
.review-body {
  display: none;
  padding: 0 18px 14px;
  border-top: 1px dashed var(--border);
  padding-top: 12px;
}
.review-body.visible { display: block; }
.review-topic {
  font-size: 14px;
  font-weight: 700;
  color: var(--text);
  margin-bottom: 6px;
}
.review-text {
  font-size: 13px;
  color: #374151;
  line-height: 1.6;
}

/* OPTIONAL LEVEL CARDS (level 2 & 3) */
.optional-card {
  margin: 12px 16px 0;
  border: 1.5px solid var(--border);
  border-radius: 14px;
  overflow: hidden;
  transition: border-color .15s;
}
.optional-card:hover { border-color: var(--accent); }
.optional-toggle {
  width: 100%;
  padding: 14px 18px;
  background: none;
  border: none;
  display: flex;
  align-items: center;
  justify-content: space-between;
  cursor: pointer;
  font-family: inherit;
  min-height: 52px;
  text-align: left;
}
.optional-toggle-left { display: flex; flex-direction: column; gap: 2px; }
.optional-toggle-title {
  font-size: 14px;
  font-weight: 700;
  color: var(--text);
}
.optional-toggle-sub {
  font-size: 12px;
  color: var(--muted);
}
.optional-toggle-arrow {
  font-size: 18px;
  color: var(--muted);
  flex-shrink: 0;
  transition: transform .2s;
}
.optional-toggle.open .optional-toggle-arrow { transform: rotate(180deg); }
.optional-body {
  display: none;
  padding: 0 18px 16px;
  border-top: 1px solid var(--border);
  padding-top: 14px;
}
.optional-body.visible { display: block; }
.optional-topic {
  font-size: 15px;
  font-weight: 700;
  color: var(--text);
  margin-bottom: 8px;
}
.optional-text {
  font-size: 14px;
  color: #374151;
  line-height: 1.65;
}
.optional-send-btn {
  display: block;
  margin-top: 14px;
  padding: 12px 16px;
  background: var(--accent-light);
  color: var(--accent);
  font-size: 13px;
  font-weight: 700;
  border: 1.5px solid var(--accent);
  border-radius: 10px;
  cursor: pointer;
  text-align: center;
  text-decoration: none;
  font-family: inherit;
  min-height: 44px;
}

/* FEEDBACK */
.section-title {
  padding: 28px 20px 12px;
  font-size: 13px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: .8px;
  color: var(--muted);
}

.feedback-toggle {
  margin: 0 16px;
  background: #fff;
  border: 1.5px solid var(--border);
  border-radius: 14px;
  padding: 14px 18px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: space-between;
  min-height: 52px;
  font-family: inherit;
  width: calc(100% - 32px);
  transition: border-color .15s;
}
.feedback-toggle:hover { border-color: var(--accent); }
.feedback-toggle.open { border-radius: 14px 14px 0 0; border-color: var(--accent); }
.feedback-toggle-left {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 2px;
}
.feedback-toggle-label {
  font-size: 14px;
  font-weight: 700;
  color: var(--text);
}
.feedback-toggle-date {
  font-size: 12px;
  color: var(--muted);
}
.feedback-toggle-arrow {
  font-size: 18px;
  color: var(--muted);
  transition: transform .2s;
}
.feedback-toggle.open .feedback-toggle-arrow { transform: rotate(180deg); }

.feedback-body {
  display: none;
  margin: 0 16px;
  background: #fff;
  border: 1.5px solid var(--accent);
  border-top: none;
  border-radius: 0 0 14px 14px;
  padding: 14px 18px;
}
.feedback-body.visible { display: block; }
.feedback-text {
  font-size: 14px;
  color: #374151;
  line-height: 1.65;
  margin-bottom: 10px;
}
.feedback-score {
  font-size: 13px;
  font-weight: 700;
  color: var(--accent);
}

/* GOAL */
.goal-card {
  margin: 0 16px;
  background: var(--nav);
  border-radius: 14px;
  padding: 18px 20px;
  display: flex;
  align-items: flex-start;
  gap: 14px;
}
.goal-icon { font-size: 28px; flex-shrink: 0; margin-top: 2px; }
.goal-title {
  font-size: 16px;
  font-weight: 700;
  color: #fff;
  line-height: 1.3;
  margin-bottom: 4px;
}
.goal-deadline {
  font-size: 12px;
  color: var(--highlight);
  font-weight: 600;
}

/* MILESTONES */
.milestones {
  margin: 0 16px;
  padding: 4px 0 4px 20px;
  position: relative;
}
.milestones::before {
  content: '';
  position: absolute;
  left: 9px;
  top: 0;
  bottom: 0;
  width: 2px;
  background: var(--border);
}
.milestone {
  position: relative;
  padding: 10px 0 10px 22px;
}
.milestone-dot {
  position: absolute;
  left: -11px;
  top: 13px;
  width: 20px;
  height: 20px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 11px;
  font-weight: 700;
  z-index: 1;
  background: var(--bg);
}
.milestone.done .milestone-dot {
  background: var(--accent);
  color: #fff;
}
.milestone.active .milestone-dot {
  background: var(--nav);
  color: var(--highlight);
  border: 2px solid var(--highlight);
}
.milestone.upcoming .milestone-dot {
  background: var(--bg);
  border: 2px solid var(--border);
  color: var(--border);
}
.milestone-text {
  font-size: 14px;
  line-height: 1.4;
  color: var(--muted);
}
.milestone.done .milestone-text { color: var(--muted); text-decoration: line-through; }
.milestone.active .milestone-text {
  color: var(--text);
  font-weight: 700;
}
.milestone.active {
  background: var(--accent-light);
  border-radius: 10px;
  border-left: 3px solid var(--accent);
  padding-left: 16px;
  margin-left: -3px;
}
.milestone.active .milestone-dot { left: -14px; }

.milestone-sub {
  font-size: 12px;
  color: var(--accent);
  margin-top: 2px;
}

/* PROGRESS NOTE */
.progress-note {
  margin: 0 16px;
  padding: 14px 18px;
  background: var(--accent-light);
  border-radius: 12px;
  font-size: 14px;
  font-weight: 600;
  color: #2E6B4F;
  border-left: 3px solid var(--highlight);
}

/* PROGRESS SCREEN */
.progress-section-title {
  padding: 24px 20px 12px;
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: .8px;
  color: var(--muted);
}

.skill-card {
  margin: 0 16px 10px;
  background: #fff;
  border-radius: 14px;
  border: 1.5px solid var(--border);
  overflow: hidden;
  transition: border-color .15s;
}
.skill-card.open { border-color: var(--accent); }

.skill-header {
  width: 100%;
  background: none;
  border: none;
  text-align: left;
  cursor: pointer;
  font-family: inherit;
  padding: 14px 18px;
  display: block;
}

.skill-card-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 10px;
}

.skill-name-row {
  display: flex;
  align-items: center;
  gap: 8px;
}

.skill-icon { font-size: 18px; }

.skill-name {
  font-size: 14px;
  font-weight: 700;
  color: var(--text);
}

.skill-right {
  display: flex;
  align-items: center;
  gap: 10px;
}

.skill-arrow {
  font-size: 18px;
  font-weight: 700;
  line-height: 1;
}
.skill-arrow.up    { color: var(--accent); }
.skill-arrow.stable { color: var(--muted); }
.skill-arrow.down  { color: var(--urgent); }

.skill-expand-arrow {
  font-size: 16px;
  color: var(--muted);
  transition: transform .2s;
}
.skill-card.open .skill-expand-arrow { transform: rotate(180deg); }

.skill-bar-wrap {
  background: var(--border);
  border-radius: 6px;
  height: 8px;
  overflow: hidden;
  margin-bottom: 6px;
}

.skill-bar-fill {
  height: 100%;
  border-radius: 6px;
  background: linear-gradient(90deg, var(--accent) 0%, var(--highlight) 100%);
  transition: width .6s ease;
}

.skill-bar-labels {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.skill-pct {
  font-size: 12px;
  font-weight: 700;
  color: var(--accent);
}

.skill-goal-label {
  font-size: 11px;
  color: var(--muted);
}

.skill-note {
  margin-top: 8px;
  font-size: 12px;
  color: var(--muted);
  font-style: italic;
  line-height: 1.4;
}

/* FUNDAMENT SECTION */
.fundament-bridge {
  display: flex;
  align-items: center;
  gap: 10px;
  margin: 16px 16px 12px;
}
.fundament-bridge-line {
  flex: 1;
  height: 1px;
  background: var(--border);
}
.fundament-bridge-text {
  font-size: 11px;
  color: var(--muted);
  white-space: nowrap;
}

.fundament-wrapper {
  margin: 0 16px 10px;
  border-radius: 16px;
  border: 2px solid var(--accent);
  overflow: hidden;
}

.fundament-label {
  padding: 11px 18px 9px;
  background: var(--accent-light);
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: .8px;
  color: var(--accent);
}

.fundament-wrapper .skill-card {
  margin: 0;
  border-radius: 0;
  border: none;
  border-top: 1px solid var(--border);
}
.fundament-wrapper .skill-card.open { border-color: transparent; }

/* CRITERIA ACCORDION */
.skill-criteria {
  display: none;
  padding: 12px 18px 16px;
  border-top: 1px solid var(--border);
  background: var(--bg);
}
.skill-criteria.visible { display: block; }

.skill-criteria-title {
  font-size: 10px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: .7px;
  color: var(--muted);
  margin-bottom: 10px;
}

.criterion-item {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 7px 6px;
  margin: 0 -6px;
  font-size: 13px;
  line-height: 1.4;
  color: var(--muted);
  cursor: pointer;
  border-radius: 8px;
  transition: background .1s;
  min-height: 44px;
}
.criterion-item:hover { background: var(--bg); }
.criterion-item:active { background: var(--accent-light); }
.criterion-item.done { color: var(--text); }

.criterion-dot {
  flex-shrink: 0;
  width: 18px;
  height: 18px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 10px;
  font-weight: 700;
  margin-top: 1px;
}
.criterion-item.done .criterion-dot {
  background: var(--accent);
  color: #fff;
}
.criterion-item:not(.done) .criterion-dot {
  border: 2px solid var(--border);
  color: var(--border);
}

.growth-legend {
  margin: 0 16px 16px;
  display: flex;
  gap: 16px;
  flex-wrap: wrap;
}

.legend-item {
  display: flex;
  align-items: center;
  gap: 5px;
  font-size: 11px;
  color: var(--muted);
}

.legend-arrow {
  font-size: 14px;
  font-weight: 700;
}

/* LÜCKEN SCREEN */
.gap-section-title {
  padding: 20px 20px 8px;
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: .8px;
  color: var(--muted);
}

.gap-card {
  margin: 0 16px 10px;
  background: #fff;
  border-radius: 14px;
  border: 1.5px solid var(--border);
  padding: 13px 16px;
  cursor: pointer;
  transition: border-color .15s, opacity .15s;
}
.gap-card.sos   { border: 2px solid #E53E3E; }
.gap-card.aktiv { border-color: var(--urgent); }
.gap-card.geloest { opacity: .5; }

.gap-card-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 7px;
}

.gap-badges { display: flex; gap: 5px; flex-wrap: wrap; }

.gap-level {
  font-size: 10px; font-weight: 700;
  padding: 2px 7px; border-radius: 10px;
  background: var(--border); color: var(--muted);
}

.gap-category {
  font-size: 10px; font-weight: 700;
  padding: 2px 7px; border-radius: 10px;
  background: var(--accent-light); color: var(--accent);
}

.gap-status-icon { font-size: 18px; line-height: 1; }

.gap-text {
  font-size: 13px;
  color: var(--text);

// ── LocalStorage: Fortschritt speichern ───────────────────────────────────
function loadProgress(studentId) {
  try { return JSON.parse(localStorage.getItem('pgc_' + studentId) || '{}'); }
  catch { return {}; }
}
function saveProgress(studentId, data) {
  localStorage.setItem('pgc_' + studentId, JSON.stringify(data));
}
function applyProgress(student, id) {
  const saved = loadProgress(id);
  student.skills.forEach((skill, si) => {
    if (!saved[si]) return;
    skill.criteria.forEach((c, ci) => {
      if (saved[si][ci] !== undefined) c.done = saved[si][ci];
    });
  });
}

  const params = new URLSearchParams(window.location.search);

function renderKulturScreen() {
  const el = document.getElementById('kultur-content');
  if (!el) return;

  const dayOfYear = Math.floor((new Date() - new Date(new Date().getFullYear(), 0, 0)) / 864e5);
  const days = ['Sonntag','Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag'];
  const months = ['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
  const now = new Date();
  const dateStr = `${days[now.getDay()]}, ${now.getDate()}. ${months[now.getMonth()]}`;

  const wort       = KULTUR_WORT[dayOfYear % KULTUR_WORT.length];
  const sprich     = KULTUR_SPRICHWORT[dayOfYear % KULTUR_SPRICHWORT.length];
  const rede       = KULTUR_REDEWENDUNG[dayOfYear % KULTUR_REDEWENDUNG.length];
  const wussten    = KULTUR_WUSSTEN[dayOfYear % KULTUR_WUSSTEN.length];
  const warum      = KULTUR_WARUM[dayOfYear % KULTUR_WARUM.length];

  const cards = [
    { type:'wort',       emoji:'🔤', label:'Wort des Tages',    data: wort,    open: true  },
    { type:'sprichwort', emoji:'📖', label:'Sprichwort',        data: sprich,  open: false },
    { type:'redewendung',emoji:'🎭', label:'Redewendung',       data: rede,    open: false },
    { type:'wussten',    emoji:'🗺️', label:'Wussten Sie schon?',data: wussten, open: false },
    { type:'warum',      emoji:'🎯', label:'Warum Deutsch?',    data: warum,   open: false },
  ];

  el.innerHTML = `
    <div class="kultur-header">
      <div class="kultur-header-top">
        <div class="kultur-day-label">Ihr tägliches Stück Deutschland</div>
        <div class="kultur-day-badge">${dateStr}</div>
      </div>
      <div class="kultur-headline">Was Deutschland ausmacht 🇩🇪</div>
      <div class="kultur-sub">Sprache, Kultur, Mentalität — jeden Tag ein bisschen tiefer.</div>
    </div>
    ${cards.map((c, i) => `
    <div class="kultur-card kultur-card-${c.type}${c.open ? ' open' : ''}" id="kc-${i}">
      <button class="kultur-toggle" onclick="toggleKultur(${i})">
        <div class="kultur-emoji">${c.emoji}</div>
        <div class="kultur-toggle-text">
          <div class="kultur-type">${c.label}</div>
          <div class="kultur-title">${c.data.title}</div>
          <div class="kultur-teaser">${c.data.teaser}</div>
        </div>
        <div class="kultur-arrow">⌄</div>
      </button>
      <div class="kultur-body${c.open ? ' visible' : ''}" id="kb-${i}">
        <div class="kultur-body-text">${c.data.body}</div>
        ${c.data.example ? `<div class="kultur-body-example">${c.data.example.replace(/\n/g,'<br>')}</div>` : ''}
      </div>
    </div>`).join('')}
    <div style="height:16px"></div>
  `;
}

function toggleKultur(i) {
  const card = document.getElementById('kc-' + i);
  const body = document.getElementById('kb-' + i);
  if (!card || !body) return;
  const open = body.classList.toggle('visible');
  card.classList.toggle('open', open);
  if (tg?.HapticFeedback) tg.HapticFeedback.selectionChanged();
}

function showTab(tab) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('screen-' + tab)?.classList.add('active');
  document.getElementById('tab-' + tab)?.classList.add('active');
  window.scrollTo(0, 0);
  if (tg?.HapticFeedback) tg.HapticFeedback.selectionChanged();
}

function toggleGrammar(id) {
  const btn = document.querySelector(`#gc-${id} .grammar-toggle`);
  const body = document.getElementById('gb-' + id);
  if (!body) return;
  const open = body.classList.toggle('visible');
  btn?.classList.toggle('open', open);
  if (tg?.HapticFeedback) tg.HapticFeedback.selectionChanged();
}

function toggleReview() {
  const btn = document.getElementById('review-toggle');
  const body = document.getElementById('review-body');
  const open = body.classList.toggle('visible');
  btn.classList.toggle('open', open);
  if (tg?.HapticFeedback) tg.HapticFeedback.selectionChanged();
}

  const btn = document.getElementById(id + '-toggle');
  const body = document.getElementById(id + '-body');
  const open = body.classList.toggle('visible');
  btn.classList.toggle('open', open);
  if (tg?.HapticFeedback) tg.HapticFeedback.selectionChanged();
}

function toggleHint() {
  const btn = document.getElementById('hint-toggle');
  const body = document.getElementById('hint-body');
  const open = body.classList.toggle('visible');
  btn.classList.toggle('open', open);
  btn.textContent = open ? '💡 Tipp ausblenden' : '💡 Tipp — wenn es gar nicht klappt';
  if (tg?.HapticFeedback) tg.HapticFeedback.selectionChanged();
}

function toggleCriterion(skillIdx, criterionIdx) {
  const id = getStudentId();
  const student = STUDENTS[id];
  if (!student) return;
  const skill = student.skills[skillIdx];
  const c = skill.criteria[criterionIdx];
  c.done = !c.done;

  // In localStorage speichern
  const saved = loadProgress(id);
  if (!saved[skillIdx]) saved[skillIdx] = {};
  saved[skillIdx][criterionIdx] = c.done;
  saveProgress(id, saved);

  // DOM aktualisieren (ohne re-render)
  const item = document.getElementById('crit-' + skillIdx + '-' + criterionIdx);
  if (item) {
    item.classList.toggle('done', c.done);
    item.querySelector('.criterion-dot').textContent = c.done ? '✓' : '○';
  }

  // Balken aktualisieren
  const doneCnt = skill.criteria.filter(c => c.done).length;
  const totalCnt = skill.criteria.length;
  const pct = totalCnt > 0 ? Math.round(doneCnt / totalCnt * 100) : 0;
  const card = document.getElementById('sk-card-' + skillIdx);
  if (card) {
    const fill = card.querySelector('.skill-bar-fill');
    const pctLabel = card.querySelector('.skill-pct');
    const goalLabel = card.querySelector('.skill-goal-label');
    if (fill) fill.style.width = pct + '%';
    if (pctLabel) pctLabel.textContent = (skillIdx >= 4)
      ? doneCnt + ' von ' + totalCnt + ' Themen ✓'
      : doneCnt + ' von ' + totalCnt + ' Kriterien ✓';
    if (goalLabel) goalLabel.textContent = (skillIdx >= 4)
      ? pct + '% aufgebaut'
      : pct + '% zum Ziel';
  }

  if (pct === 100) {
    fireCometCannon();
    if (tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
  } else {
    if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
  }
}

// ── Lücken-Log ────────────────────────────────────────────────────────────
function loadGaps(studentId) {
  try { return JSON.parse(localStorage.getItem('pgc_gaps_' + studentId) || '[]'); }
  catch { return []; }
}
function saveGaps(studentId, gaps) {
  localStorage.setItem('pgc_gaps_' + studentId, JSON.stringify(gaps));
}
function loadGapStatus(studentId) {
  try { return JSON.parse(localStorage.getItem('pgc_gap_st_' + studentId) || '{}'); }
  catch { return {}; }
}
function saveGapStatus(studentId, data) {
  localStorage.setItem('pgc_gap_st_' + studentId, JSON.stringify(data));
}

function renderGapsScreen() {
  const id = getStudentId();
  const student = STUDENTS[id];
  const container = document.getElementById('gaps-content');
  if (!student || !container) return;

  const statusOverrides = loadGapStatus(id);
  const userGaps = loadGaps(id);

  // Teacher gaps
  const teacherGaps = student.gaps.map((g, i) => ({
    ...g, _idx: i,
    status: statusOverrides[i] !== undefined ? statusOverrides[i] : g.status
  }));

  // Student gaps
  const studentGaps = userGaps.map((g, i) => {
    const idx = student.gaps.length + i;
    return { ...g, _idx: idx, status: statusOverrides[idx] !== undefined ? statusOverrides[idx] : g.status };
  });

  const statusIcon = s => s === 'sos' ? '🚨' : s === 'aktiv' ? '🔄' : '✅';
  const statusLabel = s => s === 'sos' ? 'Jetzt lösen' : s === 'aktiv' ? 'In Arbeit' : 'Gelöst';

  const card = g => `
    <div class="gap-card ${g.status}" id="gap-card-${g._idx}" onclick="toggleGapStatus(${g._idx})">
      <div class="gap-card-top">
        <div class="gap-badges">
          ${g.level && g.level !== '—' ? `<span class="gap-level">${g.level}</span>` : ''}
          <span class="gap-category">${g.category}</span>
        </div>
        <div class="gap-status-icon" title="${statusLabel(g.status)}">${statusIcon(g.status)}</div>
      </div>
      <div class="gap-text">${g.text}</div>
      <div class="gap-meta">${g.date}</div>
    </div>`;

  const teacherActive  = teacherGaps.filter(g => g.status !== 'geloest');
  const teacherGeloest = teacherGaps.filter(g => g.status === 'geloest');
  const studentActive  = studentGaps.filter(g => g.status !== 'geloest');
  const studentGeloest = studentGaps.filter(g => g.status === 'geloest');
  const allGeloest     = [...teacherGeloest, ...studentGeloest];

  container.innerHTML = `
    <div class="gaps-who-section">
      <div class="gaps-who-header">
        <span class="gaps-who-icon">👩‍🏫</span>
        <span class="gaps-who-title">Von Ihrer Lehrerin</span>
      </div>
      ${teacherActive.length
        ? teacherActive.map(card).join('')
        : '<div class="gaps-empty-small">Noch keine offenen Punkte von der Lehrerin.</div>'}
    </div>

    <div class="gaps-who-section student">
      <div class="gaps-who-header">
        <span class="gaps-who-icon">👤</span>
        <span class="gaps-who-title">Meine Beobachtungen</span>
      </div>
      ${studentActive.length
        ? studentActive.map(card).join('')
        : '<div class="gaps-empty-small">Sie können jederzeit etwas eintragen — was im Gespräch gefehlt hat, was unklar war.</div>'}
      <button class="add-gap-btn" id="add-gap-btn" onclick="toggleAddGapForm()">+ Was habe ich bemerkt?</button>
      <div class="add-gap-form" id="add-gap-form">
        <label class="add-gap-label">Was ist aufgefallen?</label>
        <textarea class="add-gap-textarea" id="gap-textarea" placeholder="Zum Beispiel: Ich wusste nicht wie man «anrufen» im Nebensatz benutzt. Oder: Das Wort fehlte mir beim Gespräch mit der Kollegin."></textarea>
        <select class="add-gap-select" id="gap-category">
          <option value="Grammatik">Grammatik</option>
          <option value="Wortschatz">Wortschatz</option>
          <option value="Sprechen">Sprechen</option>
          <option value="Schreiben">Schreiben</option>
          <option value="Anderes">Anderes</option>
        </select>
        <button class="add-gap-submit" onclick="submitGap()">Eintragen</button>
      </div>
    </div>

    ${allGeloest.length ? `
    <div class="gaps-who-section geloest">
      <div class="gaps-who-header">
        <span class="gaps-who-icon">✅</span>
        <span class="gaps-who-title">Gelöst</span>
      </div>
      ${allGeloest.map(card).join('')}
    </div>` : ''}
  `;
}

function toggleGapStatus(gapIdx) {
  const id = getStudentId();
  const student = STUDENTS[id];
  if (!student) return;

  const overrides = loadGapStatus(id);
  const userGaps = loadGaps(id);
  const allGaps = [...student.gaps, ...userGaps];
  const gap = allGaps[gapIdx];
  if (!gap) return;

  const statuses = ['sos', 'aktiv', 'geloest'];
  const current = overrides[gapIdx] !== undefined ? overrides[gapIdx] : gap.status;
  overrides[gapIdx] = statuses[(statuses.indexOf(current) + 1) % statuses.length];
  saveGapStatus(id, overrides);

  renderGapsScreen();
  if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
}

function toggleAddGapForm() {
  const form = document.getElementById('add-gap-form');
  const btn  = document.getElementById('add-gap-btn');
  if (!form) return;
  const visible = form.classList.toggle('visible');
  if (btn) btn.textContent = visible ? '✕ Schließen' : '+ Was habe ich bemerkt?';
}

function submitGap() {
  const id = getStudentId();
  const textarea = document.getElementById('gap-textarea');
  const select   = document.getElementById('gap-category');
  if (!textarea || !select) return;
  const text = textarea.value.trim();
  if (!text) return;

  const gaps = loadGaps(id);
  const today = new Date().toLocaleDateString('de-DE', { day: 'numeric', month: 'long' });
  gaps.push({ id: 'u' + Date.now(), level: '—', category: select.value, text, status: 'sos', by: 'student', date: today });
  saveGaps(id, gaps);

  textarea.value = '';
  renderGapsScreen();
  if (tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
}

function toggleSkill(idx) {
  const card = document.getElementById('sk-card-' + idx);
  const criteria = document.getElementById('sk-criteria-' + idx);
  if (!card || !criteria) return;
  const open = criteria.classList.toggle('visible');
  card.classList.toggle('open', open);
  if (tg?.HapticFeedback) tg.HapticFeedback.selectionChanged();
}

// ── Kometen-Kanone 🌠 ─────────────────────────────────────────────────────
function fireCometCannon() {
  let canvas = document.getElementById('comet-canvas');
  if (canvas) canvas.remove(); // bei Doppelaufruf neu starten
  canvas = document.createElement('canvas');
  canvas.id = 'comet-canvas';
  canvas.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:9999;';
  document.body.appendChild(canvas);

  const ctx = canvas.getContext('2d');
  canvas.width  = window.innerWidth;
  canvas.height = window.innerHeight;
  const W = canvas.width, H = canvas.height;

  const COLORS = ['#7CC8A0','#4A8C6E','#B5E8D0','#FFD97D','#FF9F7E','#A5C8F0','#ffffff'];
  const comets = [];

  for (let i = 0; i < 22; i++) {
    const angle  = (-(35 + Math.random() * 70)) * Math.PI / 180; // вверх 35–105°
    const speed  = 9 + Math.random() * 10;
    const side   = Math.random() < 0.5; // слева или справа
    comets.push({
      x:       side ? Math.random() * W * 0.45 : W - Math.random() * W * 0.45,
      y:       H + 30 + Math.random() * 60,
      vx:      Math.cos(angle) * speed * (side ? 1 : -1),
      vy:      Math.sin(angle) * speed,
      size:    2.5 + Math.random() * 3.5,
      color:   COLORS[Math.floor(Math.random() * COLORS.length)],
      tail:    [],
      tailLen: 18 + Math.floor(Math.random() * 18),
      delay:   Math.floor(Math.random() * 28),
      alpha:   1,
    });
  }

  let frame = 0;
  const TOTAL = 130;

  function draw() {
    ctx.clearRect(0, 0, W, H);
    frame++;
    let alive = false;

    for (const c of comets) {
      if (frame <= c.delay) { alive = true; continue; }

      c.tail.push({ x: c.x, y: c.y });
      if (c.tail.length > c.tailLen) c.tail.shift();

      c.x  += c.vx;
      c.y  += c.vy;
      c.vy += 0.07; // лёгкая гравитация

      if (frame > TOTAL * 0.65)
        c.alpha = Math.max(0, 1 - (frame - TOTAL * 0.65) / (TOTAL * 0.35));

      if (c.alpha <= 0) continue;
      alive = true;

      // хвост
      for (let t = 0; t < c.tail.length; t++) {
        const p = t / c.tail.length;
        const a = p * c.alpha * 0.75;
        const hex = Math.floor(a * 255).toString(16).padStart(2,'0');
        ctx.beginPath();
        ctx.arc(c.tail[t].x, c.tail[t].y, c.size * p * 0.9, 0, Math.PI * 2);
        ctx.fillStyle = c.color + hex;
        ctx.fill();
      }

      // свечение вокруг головы
      const grd = ctx.createRadialGradient(c.x, c.y, 0, c.x, c.y, c.size * 4);
      grd.addColorStop(0,   c.color + 'cc');
      grd.addColorStop(0.4, c.color + '55');
      grd.addColorStop(1,   c.color + '00');
      ctx.globalAlpha = c.alpha;
      ctx.beginPath();
      ctx.arc(c.x, c.y, c.size * 4, 0, Math.PI * 2);
      ctx.fillStyle = grd;
      ctx.fill();

      // яркое ядро
      ctx.beginPath();
      ctx.arc(c.x, c.y, c.size, 0, Math.PI * 2);
      ctx.fillStyle = '#ffffff';
      ctx.fill();
      ctx.globalAlpha = 1;
    }

    if (alive && frame < TOTAL + 30) {
      requestAnimationFrame(draw);
    } else {
      canvas.remove();
    }
  }

  requestAnimationFrame(draw);
}

function toggleFeedback() {
  const btn = document.getElementById('fb-toggle');
  const body = document.getElementById('fb-body');
  const open = body.classList.toggle('visible');
  btn.classList.toggle('open', open);
  if (tg?.HapticFeedback) tg.HapticFeedback.selectionChanged();
}

document.addEventListener('DOMContentLoaded', render);
