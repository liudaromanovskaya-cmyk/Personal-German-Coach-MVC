<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Personal German Coach — Методология</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'Segoe UI',system-ui,sans-serif; background:#FAF9F6; color:#1A1A1A; }

nav {
  background:#2D3748; height:54px; padding:0 32px;
  display:flex; align-items:center; justify-content:space-between;
  position:sticky; top:0; z-index:200;
}
.nav-logo { color:#fff; font-size:16px; font-weight:700; letter-spacing:-.2px; }
.nav-logo em { font-style:normal; color:#7CC8A0; }
.nav-meta { color:rgba(255,255,255,.35); font-size:12px; }

.layout { display:flex; min-height:calc(100vh - 54px); }

/* SIDEBAR */
.sidebar {
  width:270px; min-width:270px; background:#2D3748;
  height:calc(100vh - 54px); overflow-y:auto;
  position:sticky; top:54px; padding:12px 0 32px;
  scrollbar-width:thin; scrollbar-color:rgba(255,255,255,.15) transparent;
}
.sidebar::-webkit-scrollbar { width:4px; }
.sidebar::-webkit-scrollbar-thumb { background:rgba(255,255,255,.15); border-radius:4px; }
.sb-section-label {
  font-size:10px; text-transform:uppercase; letter-spacing:1.5px;
  color:rgba(255,255,255,.3); font-weight:700;
  padding:14px 20px 6px;
}
.sb-link {
  display:block; padding:7px 20px 7px 17px;
  color:rgba(255,255,255,.55); font-size:12px; line-height:1.45;
  text-decoration:none; border-left:3px solid transparent;
  transition:all .12s; cursor:pointer;
}
.sb-link:hover { color:#fff; background:rgba(255,255,255,.05); }
.sb-link.active { color:#7CC8A0; border-left-color:#7CC8A0; background:rgba(124,200,160,.07); font-weight:600; }

/* CONTENT */
.content { flex:1; padding:44px 52px 80px; max-width:860px; }

.page-title { font-size:30px; font-weight:700; color:#1A1A1A; margin-bottom:8px; }
.page-subtitle { color:#718096; font-size:14px; line-height:1.6; margin-bottom:48px; border-bottom:1px solid #E2E8F0; padding-bottom:24px; }

.part-section { margin-bottom:56px; scroll-margin-top:74px; }

.content h2 {
  font-size:20px; font-weight:700; color:#1A1A1A;
  margin:0 0 20px; padding-bottom:12px;
  border-bottom:2px solid #E2E8F0;
  line-height:1.3;
}
.content h3 {
  font-size:15px; font-weight:700; color:#2D3748;
  margin:26px 0 10px;
}
.content h4 {
  font-size:14px; font-weight:700; color:#4A8C6E;
  margin:18px 0 6px;
}
.content p { font-size:14px; line-height:1.78; margin-bottom:12px; }
.content ul { margin:4px 0 12px 20px; }
.content ol { margin:4px 0 12px 20px; }
.content li { font-size:14px; line-height:1.7; margin-bottom:3px; }
.content strong { font-weight:700; }
.content em { font-style:italic; color:#4A8C6E; }
.content code {
  background:#EDF7F1; border:1px solid #C6E8D7; border-radius:4px;
  padding:1px 6px; font-size:12px;
  font-family:'Consolas','Courier New',monospace; color:#2E6B4F;
}
.content pre {
  background:#2D3748; color:#e2e8f0; border-radius:8px;
  padding:20px 24px; margin:14px 0; overflow-x:auto;
  font-size:12.5px; line-height:1.65;
  font-family:'Consolas','Courier New',monospace;
}
.content pre code {
  background:none; border:none; color:#e2e8f0;
  padding:0; font-size:inherit;
}
.content hr { border:none; border-top:1px solid #E2E8F0; margin:28px 0; }

/* Tables */
.content table { width:100%; border-collapse:collapse; margin:14px 0; font-size:13px; }
.content th {
  background:#EDF7F1; color:#2E6B4F; font-weight:700;
  padding:9px 13px; text-align:left; border:1px solid #C6E8D7;
}
.content td {
  padding:8px 13px; border:1px solid #E2E8F0;
  vertical-align:top; line-height:1.55;
}
.content tr:nth-child(even) td { background:#FAFAFA; }

/* Checklist */
.chk-item {
  display:flex; align-items:flex-start; gap:10px;
  padding:5px 0; font-size:14px; line-height:1.65;
}
.chk-box {
  width:16px; height:16px; min-width:16px;
  border:2px solid #4A8C6E; border-radius:3px;
  margin-top:3px; flex-shrink:0;
}

/* Mobile */
@media (max-width:768px) {
  .sidebar { display:none; }
  .content { padding:24px 20px 60px; }
  .page-title { font-size:22px; }
}
</style>
</head>

// Decode base64 → UTF-8 string
const rawBytes = Uint8Array.from(atob(B64), c => c.charCodeAt(0));
const MD = new TextDecoder('utf-8').decode(rawBytes);

// ─── INLINE RENDERER ───────────────────────────────────────────────────
function inl(t) {
  return t
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
    .replace(/\*(.+?)\*/g,'<em>$1</em>')
    .replace(/`([^`]+)`/g,'<code>$1</code>');
}

// ─── BLOCK RENDERER ────────────────────────────────────────────────────
function renderMD(md) {
  // Strip YAML frontmatter
  md = md.replace(/^---[\s\S]*?---\s*\n/, '');

  const lines = md.split('\n');
  let out = '';
  let inPre = false, preLines = [];
  let inTable = false, tableLines = [];
  let listBuf = [], listType = null;

  function flushList() {
    if (!listBuf.length) return;
    const tag = listType === 'ol' ? 'ol' : 'ul';
    out += `<${tag}>${listBuf.join('')}</${tag}>`;
    listBuf = []; listType = null;
  }
  function flushTable() {
    if (!tableLines.length) return;
    let rows = tableLines.map(r => r.split('|').slice(1,-1).map(c=>c.trim()));
    let thead = '', tbody = '';
    rows.forEach((cells, i) => {
      if (i === 0) {
        thead = '<tr>' + cells.map(c=>`<th>${inl(c)}</th>`).join('') + '</tr>';
      } else if (i === 1 && cells.every(c=>/^[-: ]+$/.test(c))) {
        // separator — skip
      } else {
        tbody += '<tr>' + cells.map(c=>`<td>${inl(c)}</td>`).join('') + '</tr>';
      }
    });
    out += `<table><thead>${thead}</thead><tbody>${tbody}</tbody></table>`;
    tableLines = []; inTable = false;
  }

  lines.forEach(line => {
    // Code fence
    if (line.startsWith('```')) {
      if (!inPre) {
        flushList(); flushTable();
        inPre = true; preLines = [];
      } else {
        const code = preLines.join('\n')
          .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
        out += `<pre><code>${code}</code></pre>`;
        inPre = false;
      }
      return;
    }
    if (inPre) { preLines.push(line); return; }

    // Table
    if (line.startsWith('|')) {
      flushList(); inTable = true; tableLines.push(line); return;
    }
    if (inTable) flushTable();

    // Checklist
    if (/^- \[ \] /.test(line)) {
      flushList();
      out += `<div class="chk-item"><div class="chk-box"></div><span>${inl(line.slice(6))}</span></div>`;
      return;
    }
    // Bullet list
    if (/^- /.test(line)) {
      if (listType !== 'ul') { flushList(); listType = 'ul'; }
      listBuf.push(`<li>${inl(line.slice(2))}</li>`);
      return;
    }
    // Numbered list
    const olM = line.match(/^(\d+)\. (.*)/);
    if (olM) {
      if (listType !== 'ol') { flushList(); listType = 'ol'; }
      listBuf.push(`<li>${inl(olM[2])}</li>`);
      return;
    }
    flushList();

    // Headers
    if (/^#### /.test(line)) { out += `<h4>${inl(line.slice(5))}</h4>`; return; }
    if (/^### /.test(line))  { out += `<h3>${inl(line.slice(4))}</h3>`; return; }
    if (/^## /.test(line))   { out += `<h2>${inl(line.slice(3))}</h2>`; return; }
    if (/^# /.test(line))    { return; } // skip — we have own title

    // HR
    if (/^---+$/.test(line.trim())) { out += '<hr>'; return; }

    // Blank line
    if (!line.trim()) { return; }

    // Paragraph
    out += `<p>${inl(line)}</p>`;
  });

  flushList(); flushTable();
  return out;
}

// ─── BUILD PAGE ────────────────────────────────────────────────────────
(function buildPage() {
  // Split markdown into chunks at every ## PART boundary
  const clean = MD.replace(/^---[\s\S]*?---\s*\n/, '');
  const chunks = clean.split(/(?=^## PART)/m).filter(c => c.trim());

  const container = document.getElementById('parts-container');
  const sidebar = document.getElementById('sidebar');
  let partIdx = 0;

  chunks.forEach((chunk, ci) => {
    const section = document.createElement('section');
    section.className = 'part-section';
    section.innerHTML = renderMD(chunk);

    // Give each PART section an id for anchoring
    const h2 = section.querySelector('h2');
    if (h2) {
      const id = 'p' + partIdx;
      section.id = id;

      // Sidebar link
      const a = document.createElement('a');
      a.className = 'sb-link';
      a.href = '#' + id;
      a.dataset.target = id;
      a.textContent = h2.textContent;
      sidebar.appendChild(a);
      partIdx++;
    }

    container.appendChild(section);
  });

  // Scrollspy
  const links = sidebar.querySelectorAll('.sb-link');
  const obs = new IntersectionObserver(entries => {
    entries.forEach(e => {
      if (e.isIntersecting) {
        links.forEach(l => l.classList.remove('active'));
        const lnk = sidebar.querySelector(`[data-target="${e.target.id}"]`);
        if (lnk) { lnk.classList.add('active'); lnk.scrollIntoView({block:'nearest'}); }
      }
    });
  }, { rootMargin:'-5% 0px -75% 0px', threshold:0 });

  document.querySelectorAll('.part-section[id]').forEach(s => obs.observe(s));
})();
</script>
