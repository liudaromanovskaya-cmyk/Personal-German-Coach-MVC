<html lang="ru">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mein Bereich</title>

<!-- Telegram Web App SDK — обязательно, даёт доступ к теме и данным пользователя -->

<!-- Весь дизайн — в style.css. Цвета, кнопки, вкладки — всё там -->
<link rel="stylesheet" href="style.css">
</head>
<body>

<!--
  ═══════════════════════════════════════════════
  КАРКАС СТУДЕНЧЕСКОГО КАБИНЕТА
  ═══════════════════════════════════════════════
  Здесь только пустая "комната".
  Содержимое заполняется через JavaScript:
    - students.js — данные каждого студента

  ═══════════════════════════════════════════════
-->
<div id="app"></div>

<!-- Firebase Realtime Database — кросс-устройственная синхронизация -->

<!-- Шаблоны по уровням — C1 Goethe, B2, свободный курс -->

<!-- Данные студентов — загружаем первыми, app.js использует их -->
<script src="students.js"></script>

<!-- Вся логика приложения: отрисовка, вкладки, Kultur, Grammatik, Lücken -->
<script src="app.js"></script>
